services:
  assetpulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ericyaoxr/assetpulse:latest
    container_name: assetpulse
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
