services:
  assetpulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ericyaoxr/assetpulse:latest
    container_name: assetpulse
    restart: unless-stopped
    ports:
      - "${PORT:-8642}:8642"
    environment:
      - TZ=Asia/Shanghai
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - DATA_DIR=/app/data
    volumes:
      - assetpulse-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8642', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  assetpulse-data:
