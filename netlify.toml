[build]
  command = "npm run build && cd server && npm install"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "zip"
  included_files = ["server/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
