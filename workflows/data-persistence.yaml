name: "AssetPulse 数据持久化方案"
agents_dir: "agency-agents-zh"
llm:
  provider: "deepseek"
  model: "deepseek-chat"
concurrency: 2
inputs:
  - name: current_architecture
    required: true
steps:
  - id: analyze_current
    role: "engineering/engineering-software-architect"
    task: |
      分析以下应用的数据持久化现状，指出问题和风险：

      应用：AssetPulse - 资产日均成本追踪Web应用
      当前方案：纯 localStorage 持久化

      存储的数据：
      - 资产列表（含图片Base64、分类、位置等）
      - 回收站数据
      - 自定义分类列表
      - 自定义位置列表

      请分析：
      1. localStorage 的容量限制和风险
      2. 图片Base64存储的问题
      3. 数据丢失风险场景
      4. 性能瓶颈
      5. 推荐的改进方案（IndexedDB / 云同步等）

      当前架构：{{current_architecture}}
    output: analysis

  - id: design_solution
    role: "engineering/engineering-full-stack-developer"
    task: |
      基于以下分析结果，设计数据持久化改进方案：

      {{analysis}}

      要求：
      1. 使用 IndexedDB 替代 localStorage 作为主存储
      2. 保持向后兼容（自动迁移 localStorage 数据到 IndexedDB）
      3. 图片存储优化（IndexedDB 直接存Blob，不再Base64编码）
      4. 自动保存机制（防抖写入）
      5. 数据版本管理（支持schema迁移）
      6. 离线优先设计
      7. 数据完整性校验

      请输出：技术方案、API设计、迁移策略、代码结构
    output: solution
    depends_on: [analyze_current]

  - id: security_review
    role: "security/security-engineer"
    task: |
      审查以下数据持久化方案的安全性：

      {{solution}}

      请关注：
      1. XSS攻击下的数据安全
      2. 数据注入风险
      3. 导入数据验证
      4. 敏感数据处理
      5. 存储配额管理

      输出安全建议和改进措施
    output: security_report
    depends_on: [design_solution]

  - id: final_plan
    role: "engineering/engineering-software-architect"
    task: |
      综合以下分析和安全审查，输出最终实施计划：

      现状分析：{{analysis}}
      技术方案：{{solution}}
      安全审查：{{security_report}}

      输出：最终实施方案、优先级排序、实施步骤
    depends_on: [security_review]
